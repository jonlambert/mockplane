name: Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build mockplane
        run: pnpm --filter mockplane build

      - name: Typecheck
        run: |
          pnpm --filter mockplane exec tsgo --noEmit
          pnpm --filter mockplane-example exec tsgo --noEmit

      - name: Unit tests
        run: pnpm --filter mockplane test

      - name: Install Playwright browsers
        run: pnpm --filter mockplane-example exec playwright install chromium
          --with-deps

      - name: Run tests
        run: pnpm --filter mockplane-example test
